name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for broken internal links
        run: |
          grep -o 'href="#[a-zA-Z0-9_-]*"' index.html | sed 's/href="#//; s/"//' | sort -u > /tmp/anchors.txt
          while read -r anchor; do
            grep -q "id=\"$anchor\"" index.html || { echo "Missing anchor target: #$anchor"; exit 1; }
          done < /tmp/anchors.txt

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
